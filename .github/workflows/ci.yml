name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    env:
      # The matrix, not the repository's .python-version pin, selects the
      # interpreter. uv downloads it if the runner does not have it.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras

      # A matrix entry that silently runs on the runner's default Python would
      # hide the 3.11 floor regressing, so assert it before anything else runs.
      - name: Verify the matrix interpreter
        shell: bash
        env:
          EXPECTED: ${{ matrix.python }}
        run: |
          actual="$(uv run python -V 2>&1)"
          echo "$actual"
          case "$actual" in
            "Python ${EXPECTED}."*) ;;
            *)
              echo "::error::expected Python ${EXPECTED}.x from the matrix, got '$actual'"
              exit 1
              ;;
          esac

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src

      # The coverage floor lives in [tool.coverage.report] so `make test` and
      # CI enforce the same number.
      - name: Test
        run: uv run pytest --cov=optforge --cov-report=term-missing
