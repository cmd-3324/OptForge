[project]
name = "optforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Max Miller", email = "ali.alipour4576@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pathlib>=1.0.1",
    "psutils>=3.3.17",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
optforge = "optforge.diskcheck.cli:app"
envcheck = "optforge.envcheck.cli:app"
portcheck = "optforge.portcheck.cli:app"
pycacheClean = "optforge.pycacheClean.cli:app"
[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
