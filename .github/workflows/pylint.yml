name: pylint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pylint -e .
      - run: pylint src/optforge --disable=C0114,C0115,C0116 --fail-under=8
