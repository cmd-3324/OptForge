name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Write version from the release tag
        env:
          # A release event carries the tag; a manual run carries whatever ref
          # was selected, which must also be a tag.
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+|-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag; expected vX.Y.Z"
            exit 1
          fi
          printf '__version__ = "%s"\n' "$version" > src/optforge/_version.py
          echo "Building version $version"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
