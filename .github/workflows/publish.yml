name: publish

"on":
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.7"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.7"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Verify tag matches package version
        run: |
          uv run python -c "
          import os, pathlib, re
          text = pathlib.Path('src/optforge/_version.py').read_text(encoding='utf-8')
          version = re.search(r'__version__ = \"([^\"]+)\"', text).group(1)
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          assert tag == version, f'tag {tag} != version {version}'
          "
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
