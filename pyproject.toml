[project]
name = "optforge"
version = "0.2.0"
description = "Cross-platform developer CLI tools for ports, environment variables, disk usage, and Python cache cleanup."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Max Miller", email = "ali.alipour4576@gmail.com" },
]

requires-python = ">=3.13"
keywords = ["cli", "developer-tools", "ports", "environment", "disk", "pycache"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "psutil>=6.0.0",
    "pycaw>=20240210; sys_platform == 'win32'",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
optforge = "optforge:main"
portcheck = "optforge.portcheck.cli:app"
envcheck = "optforge.envcheck.cli:app"
diskcheck = "optforge.diskcheck.cli:app"
pycache-clean = "optforge.pycacheclean.cli:app"
pycacheClean = "optforge.pycacheclean.cli:app"
killNotif = "optforge.killNotif.cli:app"
vol = "optforge.volume.cli:app"

[project.urls]
Homepage = "https://github.com/cmd-3324/OptForge"
Repository = "https://github.com/cmd-3324/OptForge"
Issues = "https://github.com/cmd-3324/OptForge/issues"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optforge"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/optforge",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/Makefile",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[project.urls]
Homepage = "https://github.com/cmd-3324/OptForge"


[tool.mypy]
python_version = "3.13"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.coverage.run]
source = ["optforge"]
branch = true

[tool.coverage.report]
show_missing = true
